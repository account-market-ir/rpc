<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP City Shop</title>

<style>
:root{
  --bg:#f5f5f5;
  --text:#111;
  --card:#ffffff;
  --accent:#66bb6a;
}
body.dark{
  --bg:#0f0f0f;
  --text:#ffffff;
  --card:#1c1c1c;
  --accent:#81c784;
}
body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:var(--card);
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
button{
  padding:8px 18px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(0,0,0,0.25);
  transform:translateY(-2px);
  transition:0.2s;
}
button:hover{ transform:translateY(-4px); }

.main{display:flex;}
.container{
  flex:3;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:var(--card);
  padding:20px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,0.15);
}
.emoji{font-size:50px;}
.qty{display:flex;justify-content:center;gap:10px;margin:10px 0;}
.qty span{min-width:20px;font-weight:bold;}

.cart{
  flex:1;
  background:var(--card);
  padding:15px;
  border-right:3px solid var(--accent);
}

.category-screen{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  z-index:999;
}
.cat-btn{
  width:220px;
  font-size:18px;
}

.receipt-screen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,var(--accent),#000000aa);
  display:none;
  align-items:center;
  justify-content:center;
}
.receipt{
  width:90%;
  max-width:420px;
  background:var(--card);
  border-radius:22px;
  padding:20px;
  text-align:center;
}
.line{
  border-top:2px dashed var(--accent);
  margin:12px 0;
}
.track{
  background:var(--accent);
  padding:6px;
  border-radius:10px;
  font-weight:bold;
}
a{color:var(--accent);text-decoration:none;}
.channel-banner{
  display:block;text-align:center;padding:11px 14px;
  background:var(--accent);color:#111;font-weight:bold;
}
.cart-row{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 0;border-bottom:1px solid #8885;flex-wrap:wrap;}
.cart-row .qty{align-items:center;margin:0;gap:6px;}
.cart-row button{padding:5px 10px;}
.section-title{grid-column:1/-1;text-align:center;}
.note{line-height:1.8;}
@media(max-width:700px){.main{flex-direction:column}.cart{border-right:0;border-top:3px solid var(--accent)}}
</style>
</head>

<body>

<a class="channel-banner" href="https://rubika.ir/SHAPMaziar" target="_blank" rel="noopener">
📣 کانال شاپ مازیار: @SHAPMaziar
</a>

<div class="category-screen" id="categoryScreen">
  <h2>دسته بندی محصولات</h2>
  <button class="cat-btn" onclick="openCategory('food')">🍔 غذا ها</button>
  <button class="cat-btn" onclick="openCategory('items')">📦 وسایل ها</button>
  <button class="cat-btn" onclick="openCategory('jewel')">💎 جواهرات</button>
  <button class="cat-btn" onclick="openCategory('jobs')">🧑‍💼 شغل ها</button>
  <button class="cat-btn" onclick="openCategory('kitchen')">🍳 وسایل آشپزی</button>
  <button class="cat-btn" onclick="openCategory('rare')">✨ کمیاب</button>
  <button class="cat-btn" onclick="openCategory('coins')">🪙 خرید سکه و جم</button>
</div>

<header>
  <h3>🛒 RP City Shop</h3>
  <div style="display:flex;gap:8px;align-items:center;">
    <button onclick="showReceipt()">🧾 دریافت فیش</button>
    <button onclick="toggleTheme()">🌙 / ☀️</button>
  </div>
</header>

<div class="main">
<div class="container" id="products"></div>

<div class="cart">
  <h3>🧺 سبد خرید</h3>
  <div id="cartItems"></div>
  <div id="totalPrice">جمع: ۰ سکه</div>
  <div style="margin-top:14px;text-align:center;">
    <button onclick="showReceipt()">🧾 دریافت فیش</button>
  </div>
</div>
</div>

<div class="receipt-screen" id="receiptScreen">
  <div class="receipt" id="receiptBox"></div>
</div>

<script>
const products = {

food:[
["هات داگ","🌭",40],
["کیک","🎂",200],
["کیک عادی","🍰",20],
["پیتزا","🍕",80],
["سوپ","🍲",50],
["املت","🍳",50],
["نیمرو","🍳",25],
["شیر","🥛",4],
["عسل","🍯",80],
["سیب","🍎",8],
["نان","🍞",10],
["نان ساندویچی","🥪",13]
],

items:[
["سنگ","🪨",2],
["برگ","🍃",8],
["گندم","🌾",4],
["آب","💧",2],
["بنزین","⛽",40],
["زهر عقرب","🦂",200]
],

jewel:[
["مروارید","💎",1900],
["گردنبند مروارید","📿",5000],
["تخم طلا","🥚",1700],
["یاقوت","🔴",1700]
],

jobs:[
["درخواست پلیس","🚓",500],
["درخواست دکتر","🩺",500],
["کارآگاه","🕵️",500]
],

kitchen:[
["مرغ","🐓",30],
["گوشت","🍗",30],
["جوجه","🐤",25],
["تخم مرغ","🥚",4],
["سوسیس","🌭",8]
],

rare:[
["چوب طلایی","🪵",2000],
["جام طلایی","🏆",2000],
["سکه طلایی","🪙",2000],
["ماهی","🐟",2000],
["استیک","🥩",2000],
["کلید","🗝️",2000]
],

coins:[
["۱۰۰ هزار سکه","🪙",20],
["۲۰۰ هزار سکه","🪙",40],
["۳۰۰ هزار سکه","🪙",60],
["۴۰۰ هزار سکه","🪙",80],
["۵۰۰ هزار سکه","🪙",100],
["۶۰۰ هزار سکه","🪙",120],
["۷۰۰ هزار سکه","🪙",140],
["۸۰۰ هزار سکه","🪙",160],
["۹۰۰ هزار سکه","🪙",180],
["۱ میلیون سکه","💰",200],
["۳۲۰۰ جم","💎",120000],
["۸۴۰۰ جم","💎",300000],
["۱۸۰۰۰ جم","💎",600000]
]

};

let cart={}, total=0;

function toggleTheme(){ document.body.classList.toggle("dark"); }

function playButtonSound(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx) return;
    const ctx=new AudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(740,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(520,ctx.currentTime+0.055);
    gain.gain.setValueAtTime(0.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.07,ctx.currentTime+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.075);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.08);
    osc.onended=()=>ctx.close();
  }catch(e){}
}

function openCategory(cat){
  document.getElementById("categoryScreen").style.display="none";
  const container=document.getElementById("products");
  container.innerHTML="";

  container.innerHTML+=`
  <div style="grid-column:1/-1;text-align:center;">
    <button onclick="goBack()">🔙 برگشت به دسته‌بندی</button>
  </div>`;

  if(cat==="coins"){
    container.innerHTML+=`<div style="grid-column:1/-1;text-align:center;"><h3>🪙 قیمت‌ها به تومان ایران</h3></div>`;
  }

  products[cat].forEach(p=>{
    const isCoinPack = cat==="coins";
    const priceLabel = Number(p[2]).toLocaleString('fa-IR') + (isCoinPack ? " تومان" : " سکه");
    container.innerHTML+=`
    <div class="card" data-name="${p[0]}" data-price="${p[2]}" data-currency="${isCoinPack ? "تومان" : "سکه"}">
      <div class="emoji">${p[1]}</div>
      <h4>${p[0]}</h4>
      <p>${isCoinPack ? "قیمت هر بسته: " : "هر دانه: "}${priceLabel}</p>
      <div class="qty">
        <button onclick="changeQty(this,-1)">➖</button>
        <span>1</span>
        <button onclick="changeQty(this,1)">➕</button>
      </div>
      <button onclick="addToCart(this)">خرید</button>
    </div>`;
  });
}

function goBack(){
  document.getElementById("products").innerHTML="";
  document.getElementById("categoryScreen").style.display="flex";
}

function changeQty(btn,n){
  playButtonSound();
  const span=btn.parentElement.querySelector("span");
  let q=parseInt(span.innerText);
  q=Math.max(1,q+n);
  span.innerText=q;
}

function addToCart(btn){
  const card=btn.parentElement;
  const name=card.dataset.name;
  const price=parseInt(card.dataset.price);
  const qty=parseInt(card.querySelector(".qty span").innerText);
  const currency=card.dataset.currency || "سکه";
  if(!cart[name]) cart[name]={count:0,price:price,currency:currency};
  cart[name].count+=qty;
  recalculateTotal();
  renderCart();
}

function renderCart(){
  let html="";
  let coinTotal=0, tomanTotal=0;
  for(let i in cart){
    const currency=cart[i].currency || "سکه";
    if(currency==="تومان") tomanTotal+=cart[i].count*cart[i].price;
    else coinTotal+=cart[i].count*cart[i].price;
    html+=`<div class="cart-row">
      <span>${i} — ${cart[i].count} عدد</span>
      <div class="qty">
        <button onclick="changeCartQty('${i.replace(/'/g, "\\'")}',-1)">➖</button>
        <span>${cart[i].count}</span>
        <button onclick="changeCartQty('${i.replace(/'/g, "\\'")}',1)">➕</button>
      </div>
    </div>`;
  }
  document.getElementById("cartItems").innerHTML=html;
  let totals=[];
  if(coinTotal) totals.push(coinTotal.toLocaleString('fa-IR')+" سکه");
  if(tomanTotal) totals.push(tomanTotal.toLocaleString('fa-IR')+" تومان");
  document.getElementById("totalPrice").innerText="جمع: "+(totals.join(" + ") || "۰ سکه");
}

function changeCartQty(name,delta){
  playButtonSound();
  if(!cart[name]) return;
  cart[name].count+=delta;
  if(cart[name].count<=0) delete cart[name];
  recalculateTotal();
  renderCart();
}

function recalculateTotal(){
  total=0;
  for(const name in cart) total+=cart[name].count*cart[name].price;
}

function showReceipt(){
  const now=new Intl.DateTimeFormat('fa-IR',{
    dateStyle:'short',
    timeStyle:'short',
    timeZone:'Asia/Tehran'
  }).format(new Date());

  let items="";
  let coinTotal=0, tomanTotal=0;
  for(let i in cart){
    items+=`<div style="display:flex;justify-content:space-between;gap:10px;margin:7px 0;"><span>نام محصول: ${i}</span><span>تعداد: ${cart[i].count}</span></div>`;
    const amount=cart[i].count*cart[i].price;
    if((cart[i].currency || "سکه")==="تومان") tomanTotal+=amount;
    else coinTotal+=amount;
  }
  const totals=[];
  if(coinTotal) totals.push(coinTotal.toLocaleString('fa-IR')+" سکه");
  if(tomanTotal) totals.push(tomanTotal.toLocaleString('fa-IR')+" تومان");
  const totalLabel=totals.join(" + ") || "۰ سکه";

  const code="RPC-"+Math.floor(Math.random()*90000+10000);

  document.getElementById("receiptBox").innerHTML=`
    <h3>🛍 RP City Shop</h3>
    <div class="line"></div>
    <strong>جزئیات خرید:</strong><br>
    ${items || "محصولی انتخاب نشده است"}<br>
    مبلغ کل: ${totalLabel}<br>
    تاریخ: ${now}<br><br>
    <div class="track">کد پیگیری: ${code}</div>
    <div class="line"></div>
    به آیدی:
    <a href="https://rubika.ir/Admin12DARK">@Admin12DARK</a><br><br>
    <button onclick="closeReceipt()">🔙 بازگشت</button>
  `;
  document.getElementById("receiptScreen").style.display="flex";
}

function closeReceipt(){
  document.getElementById("receiptScreen").style.display="none";
}
</script>

</body>
</html>
